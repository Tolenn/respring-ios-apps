name: Build Modern iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Revert Legacy CgBI PNG Optimizations
        run: |
          echo "Uncrushing legacy Apple CgBI-compressed PNGs to standard RGBA format..."
          COUNT=0
          for img in "Finger Olympic/Fingerolympic/Resources"/*.png; do
            if [ -f "$img" ]; then
              xcrun -sdk iphoneos pngcrush -revert-iphone-optimizations -q "$img" "${img}.fixed" 2>/dev/null || true
              if [ -f "${img}.fixed" ]; then
                mv "${img}.fixed" "$img"
                COUNT=$((COUNT + 1))
              fi
            fi
          done
          echo "Successfully uncrushed $COUNT legacy textures to standard RGBA format."

      - name: Build Xcode Project
        run: |
          xcodebuild -project "Finger Olympic/Fingerolympic.xcodeproj" \
                     -scheme Fingerolympic \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package and Sign IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "Fingerolympic.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Fingerolympic.app not found!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/

          # 1. Flatten Resources folder if present into the root of .app
          # iOS expects icons, databases, and assets to sit at the root of the .app bundle
          if [ -d "build/Payload/Fingerolympic.app/Resources" ]; then
            echo "Flattening nested Resources into bundle root..."
            cp -R "build/Payload/Fingerolympic.app/Resources/"* "build/Payload/Fingerolympic.app/"
            rm -rf "build/Payload/Fingerolympic.app/Resources"
          fi

          # 2. Clean out any legacy or conflicting files
          rm -rf "build/Payload/Fingerolympic.app/FBConnect.bundle"
          rm -f "build/Payload/Fingerolympic.app/ResourceRules.plist"
          rm -rf "build/Payload/Fingerolympic.app/_CodeSignature"

          # 3. Apply standard ad-hoc code signature with explicit bundle identifier
          # -i binds CFBundleIdentifier com.fingerway.fingerolympicfull into CodeDirectory
          # --generate-entitlement-der embeds DER entitlements required for iOS 15+
          echo "Signing application bundle with com.fingerway.fingerolympicfull..."
          codesign --force --sign - \
                   --identifier "com.fingerway.fingerolympicfull" \
                   --generate-entitlement-der \
                   --timestamp=none \
                   "build/Payload/Fingerolympic.app"

          # 4. Verify signature details and inspect CodeDirectory
          echo "=== Verifying Code Signature ==="
          codesign -dvvv "build/Payload/Fingerolympic.app"

          # 5. Package into IPA
          cd build
          zip -r Fingerolympic.ipa Payload
          ls -lh Fingerolympic.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fingerolympic-iOS-IPA
          path: build/Fingerolympic.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.2
          name: "Finger Olympic v1.4.2 (Full Graphics & Authentic Art Restoration)"
          body: |
            ### Finger Olympic Modern 64-bit iOS Restoration (v1.4.2)

            **Major Graphics & Visual Restoration:**
            - **Uncrushed 334 Legacy CgBI Textures**: Uncrushed all Apple-proprietary CgBI PNG textures back to standard W3C RGBA so modern SpriteKit and Metal render every sprite, background, and character crisply.
            - **Authentic Full-Screen Environments**: Restored `fondoHome.png` (Home Screen), `fondoMenuDiscip.png` (Disciplines Carousel), `background.png` (Stadium Track), and `podium.png` (Olympic Awards Ceremony).
            - **Real Controls & HUD**: Restored authentic fingerprint buttons (`HuellaIzquierda.png`, `HuellaDerecha.png`, `HuellaTocada`), authentic hurdle barriers (`valla.png`), and digital scoreboard (`ScoreBoard.png`).
            - **High-Fidelity CGImage Cropping**: Overhauled `AtlasLoader.swift` to extract pixel-perfect subtextures from Zwoptex Format 3 sprite atlases.

            **Installation:**
            - **SideStore / AltStore**: Download `Fingerolympic.ipa` and open in SideStore / AltStore to install.
            - **LiveContainer**: Import `Fingerolympic.ipa` directly into LiveContainer.
            - **Sideloadly / TrollStore**: Direct install supported.
          files: build/Fingerolympic.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
